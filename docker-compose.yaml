services:
  nginx:
    image: nginx
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - 8080:80

  front-end:
    image: ghcr.io/mcmastercce/bvd-103-mcmasterful-books/mcmasterful-books-docker:main
    volumes:
      - ./adapter:/source/adapter

  server:
    image: node:20
    volumes:
      - ./:/app
    working_dir: /app
    command: npx -y tsx ./run-server.ts

  server2:
    image: node:20
    volumes:
      - ./:/app
    working_dir: /app
    command: npx -y tsx ./run-server.ts

  server3:
    image: node:20
    volumes:
      - ./:/app
    working_dir: /app
    command: npx -y tsx ./run-server.ts
  
  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - ./init:/docker-entrypoint-initdb.d
